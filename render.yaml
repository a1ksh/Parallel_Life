services:
  - type: web
    name: parallel-life
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parallel-life-db
          property: connectionString
      - key: PARALLEL_LIFE_AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: parallel-life-db
    region: frankfurt
    plan: free
    ipAllowList: []
