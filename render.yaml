services:
  - type: web
    name: parallel-life
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PLAYER_DATABASE_URL
        sync: false
      - key: MIGRATE_RENDER_SAVES
        value: "0"
      - key: PARALLEL_LIFE_AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
